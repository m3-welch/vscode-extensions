name: Publish extensions

on:
  workflow_dispatch:
    inputs:
      # Regenerate with: node .github/scripts/select-extensions.mjs --sync-workflow
      # BEGIN GENERATED EXTENSION INPUTS
      all:
        description: 'Publish all extensions'
        type: boolean
        default: false
      markdown-live-view:
        description: 'markdown-live-view'
        type: boolean
        default: false
      # END GENERATED EXTENSION INPUTS

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.actor == 'm3-welch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve extension selection
        id: selection
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          node .github/scripts/select-extensions.mjs --check-workflow
          available="$(node .github/scripts/select-extensions.mjs --list)"
          {
            echo '### Available extensions'
            echo
            node -e 'JSON.parse(process.argv[1]).forEach((name) => console.log(`- \`${name}\``))' "$available"
          } >> "$GITHUB_STEP_SUMMARY"
          selection="$(node .github/scripts/select-extensions.mjs "$INPUTS_JSON")"
          echo "extensions=$selection" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and compile
        env:
          SELECTION: ${{ steps.selection.outputs.extensions }}
        run: |
          mapfile -t extensions < <(node -e 'JSON.parse(process.argv[1]).forEach((name) => console.log(name))' "$SELECTION")
          npm install --global @vscode/vsce@4.1.1
          for extension in "${extensions[@]}"; do
            directory="extensions/$extension"
            npm ci --prefix "$directory"
            pushd "$directory" >/dev/null
            vsce package --out "$RUNNER_TEMP/$extension.vsix"
            popd >/dev/null
          done

      - name: Publish selected extensions
        env:
          SELECTION: ${{ steps.selection.outputs.extensions }}
        run: |
          mapfile -t extensions < <(node -e 'JSON.parse(process.argv[1]).forEach((name) => console.log(name))' "$SELECTION")
          for extension in "${extensions[@]}"; do
            vsce publish --oidc --packagePath "$RUNNER_TEMP/$extension.vsix"
          done
